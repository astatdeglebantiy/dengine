name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]

    steps:
      - name: Check out dengine
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential ninja-build cmake git pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libibus-1.0-dev libpipewire-0.3-dev libdrm-dev libgbm-dev

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Install Vulkan shader compiler
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.363.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Headers, SPIRV-Tools
          vulkan-use-cache: true

      - name: Check out SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.18
          path: deps/SDL

      - name: Configure SDL3
        shell: bash
        run: >
          cmake -S deps/SDL -B deps/SDL/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          -DSDL_SHARED=ON
          -DSDL_STATIC=OFF
          -DSDL_TEST_LIBRARY=OFF
          -DSDL_TESTS=OFF
          -DSDL_EXAMPLES=OFF
          -DSDL_INSTALL=ON

      - name: Build and install SDL3
        run: cmake --build deps/SDL/build --config Release --target install

      - name: Configure dengine
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3"

      - name: Build dengine
        run: cmake --build build --config Release --verbose

      - name: Run automated tests
        run: ctest --test-dir build --output-on-failure
